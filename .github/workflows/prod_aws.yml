name: 'severity-formula: Build & Push to AWS Prod'

# calc.hacken.io runs on the AWS prod cluster. This repository (hknio) is the
# source; "Sync to haas-labs" mirrors every push to haas-labs/severity-formula,
# and only that copy runs this job -- it has the AWS runner and the
# haas-deployment token. Here in hknio the job is skipped.
#
# The job builds the image, pushes it to ECR and writes the tag into the
# manifest in haas-deployment, where ArgoCD picks it up. prod.yaml, which used to
# deploy to GKE, is disabled in the GitHub Actions settings rather than deleted.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: eu-west-1
  ECR_REGISTRY: 459501022842.dkr.ecr.eu-west-1.amazonaws.com
  ECR_REPOSITORY: hacken/severity-formula
  DEPLOYMENT_PATH: prod/web-audits/severity-formula.yaml

jobs:
  build_and_push:
    if: github.repository_owner == 'haas-labs'
    runs-on: gha-arc-basic
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "image=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" >> $GITHUB_OUTPUT

      # No static keys: the runner's instance role carries ECR push rights.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        run: |
          docker build -f Dockerfile -t ${{ steps.tag.outputs.image }} .
          docker push ${{ steps.tag.outputs.image }}

      - name: Checkout haas-deployment
        uses: actions/checkout@v4
        with:
          repository: haas-labs/haas-deployment
          token: ${{ secrets.HAAS_DEVOPS }}
          ref: main
          path: haas-deployment

      # Only the tag line inside this file's image block.
      - name: Update the deployment tag
        run: |
          cd haas-deployment
          sed -i "\|repository: .*${{ env.ECR_REPOSITORY }}|{n;s|tag: .*|tag: ${{ steps.tag.outputs.tag }}|}" \
            ${{ env.DEPLOYMENT_PATH }}
          grep -A1 'repository:' ${{ env.DEPLOYMENT_PATH }}

      - name: Commit and push
        run: |
          cd haas-deployment
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- ${{ env.DEPLOYMENT_PATH }}; then
            echo "No change to commit."
            exit 0
          fi
          git add ${{ env.DEPLOYMENT_PATH }}
          git commit -m "${{ env.ECR_REPOSITORY }} prod: ${{ steps.tag.outputs.tag }}"
          git pull --rebase origin main
          git push
